name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and CPython
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" python install 3.14 ${{ matrix.python }}

      - name: Install Hermes at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout ed1afb082eb3e46cf2edae9d8f68fb67b09ee4df
          cd "$RUNNER_TEMP/hermes-agent"
          UV="$HOME/.local/bin/uv"
          # The lock only resolves python_full_version >= 3.14.
          "$UV" sync --locked --python 3.14
          "$UV" pip install --python .venv/bin/python pytest
          if [ "${{ matrix.python }}" = "3.14" ]; then
            echo "PY=$RUNNER_TEMP/hermes-agent/.venv/bin/python" >> "$GITHUB_ENV"
            echo "HERMES=$RUNNER_TEMP/hermes-agent/.venv/bin/hermes" >> "$GITHUB_ENV"
          else
            "$UV" venv --python "${{ matrix.python }}" "$RUNNER_TEMP/venv"
            "$UV" pip freeze --python .venv/bin/python \
              | grep -v -E '^-e ' > "$RUNNER_TEMP/reqs.txt"
            "$UV" pip install --python "$RUNNER_TEMP/venv/bin/python" -r "$RUNNER_TEMP/reqs.txt"
            "$UV" pip install --python "$RUNNER_TEMP/venv/bin/python" -e . --no-deps
            echo "PY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
            echo "HERMES=$RUNNER_TEMP/venv/bin/hermes" >> "$GITHUB_ENV"
          fi

      - name: pytest
        run: |
          "$PY" -m pytest -q

      - name: hermes plugins validate and doctor
        run: |
          "$HERMES" plugins validate . --install-deps
          "$HERMES" plugins doctor . --ci
